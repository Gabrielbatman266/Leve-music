name: Build Leve Music

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leve-music-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.LEVE_KEYSTORE_B64 }}
          STORE_PW: ${{ secrets.LEVE_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PW" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/leve.keystore"
            echo "LEVE_STORE_PASSWORD=$STORE_PW" >> "$GITHUB_ENV"
          else
            PW=$(openssl rand -hex 16)
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore "$RUNNER_TEMP/leve.keystore" -storepass "$PW" -keypass "$PW" \
              -alias leve -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Leve Music"
            echo "LEVE_STORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi
          echo "LEVE_KEYSTORE=$RUNNER_TEMP/leve.keystore" >> "$GITHUB_ENV"

      - name: Version
        run: |
          echo "LEVE_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "LEVE_VERSION_NAME=Leve #${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain assembleIzzyRelease -x lint --stacktrace
        env:
          METROLIST_APPLICATION_ID: com.gabriel.levemusic
          METROLIST_APP_NAME: Leve Music

      - name: Rename APK
        run: |
          mkdir -p out
          cp $(find app/build/outputs/apk/izzy/release -name "*.apk" | head -1) out/LeveMusic.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeveMusic
          path: out/LeveMusic.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="leve-music-${{ github.run_number }}"
          gh release create "$TAG" out/LeveMusic.apk \
            --target "${{ github.sha }}" \
            --title "Leve Music #${{ github.run_number }}" \
            --notes "APK do Leve Music. Baixe o arquivo LeveMusic.apk abaixo." \
            --latest=false
